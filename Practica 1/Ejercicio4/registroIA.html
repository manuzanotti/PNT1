<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi formulario</title>

        <style>
        /* 1. Resets globales y tipografía */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a; /* Fondo oscuro elegante */
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. Encabezado */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* 3. Contenedor principal y Tarjeta del Formulario */
        main {
            width: 100%;
            max-width: 480px;
        }

        section {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* 4. Estructura interna de los campos */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Agrega espacio uniforme entre cada div sin necesidad de usar <br> */
        }

        form div {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* 5. Estilos de las etiquetas (Labels) */
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 6. Estilos de los campos de entrada (Inputs) */
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Efecto cuando el usuario hace clic/foco en un input */
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background-color: #111827;
        }

        /* Estilo del placeholder */
        input::placeholder {
            color: #64748b;
        }

        /* 7. Botón de Envío */
        button[type="submit"] {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Efectos del botón */
        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }
    </style>
    </head>
    <body>

        <header>
            <h1>Mi formulario</h1>
        </header>

        <main>
            <section>
                <form action="enviar-form"> 
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" name="nombre" id="nombre" placeholder="Ej: Juanito de la Cruz" required>
                    </div>
                    <br>
                    <div>
                        <label for="apellido">Apellido</label>
                        <input type="text" name="apellido" id="apellido" required>
                    </div>
                    <br>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <br>
                    <div>
                        <label for="contrasenia">Contraseña</label>
                        <input type="password" name="contrasenia" id="contrasenia" required>
                    </div>
                    <br>
                    <div>
                        <label for="edad">Edad</label>
                        <input type="number" name="edad" id="edad" required min="0" max="120">
                    </div>

                        <button type="submit">Enviar</button>
                </form>
    
            </section>

        </main>


    </body>
</html>
