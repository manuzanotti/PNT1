<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form corregiodo + IA</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Tarjeta del formulario */
        form {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Etiquetas de texto */
        label {
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        /* Campos de texto y email */
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #38bdf8;
        }

        /* Título del grupo de Radios */
        p {
            margin: 8px 0 0 0;
            font-weight: 600;
            color: #38bdf8;
        }

        /* Contenedor alineado para los botones Radio */
        .opcion-radio {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        input[type="radio"] {
            accent-color: #2563eb;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form>

    <label for="nombre">
        Nombre
    </label>
    
    <input
        type="text"
        id="nombre"
    >

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
    >

    <!-- asociamos el for "nombre" al id "nombre", modificando el id antes llamado apellido  -->
    <!--modificamos el id de email, antes llamado correo.  -->
    <!--modificamos el type de email.  -->



    <p>
        Modalidad
    </p>

    <input
        type="radio"
        name="modalidad"
        id="presencial"
    >

    <label for="presencial">
        Presencial
    </label>

    <input
        type="radio"
        name="modalidad"
        id="virtual"
    >

    <label for="virtual">
        Virtual
    </label>

        <!--cambiamos virtal por presencial en el for del primer label  -->

          <!--Este comentario me lo hizo la IA  -->
          <!--En las input type "radio" agregarles siempre el value, dato que sera envado al servidor  -->
</form>

</body>
</html>
