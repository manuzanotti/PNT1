<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form corregido</title>
</head>
<body>
    <form>

    <label for="nombre">
        Nombre
    </label>
    
    <input
        type="text"
        id="nombre"
    >

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
    >

    <!-- asociamos el for "nombre" al id "nombre", modificando el id antes llamado apellido  -->
    <!--modificamos el id de email, antes llamado correo.  -->
    <!--modificamos el type de email.  -->



    <p>
        Modalidad
    </p>

    <input
        type="radio"
        name="modalidad"
        id="presencial"
    >

    <label for="presencial">
        Presencial
    </label>

    <input
        type="radio"
        name="modalidad"
        id="virtual"
    >

    <label for="virtual">
        Virtual
    </label>

        <!--cambiamos virtal por presencial en el for del primer label  -->

          <!--Este comentario me lo hizo la IA  -->
          <!--En las input type "radio" agregarles siempre el value, dato que sera envado al servidor  -->
</form>

</body>
</html>
