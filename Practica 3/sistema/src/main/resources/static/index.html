<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Iconos de FontAwesome (para los iconos de usuario y candado) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <!-- Columna Izquierda: Formulario -->
    <div class="login-form-section">
      <div class="card-login">
        <h1 class="system-title">Sistema de Tickets</h1>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">Nombre de Usuario *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user icon"></i>
              <input type="text" id="username" placeholder="juan.perez@empresa.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña *</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-key icon"></i>
              <input type="password" id="password" placeholder="••••••••••••" required>
              <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>
          </div>

          <div class="forgot-password">
            <a href="#">¿Ha olvidado su contraseña?</a>
          </div>

          <button type="submit" class="btn-primary">Entrar</button>
        </form>
      </div>
    </div>

    <!-- Columna Derecha: Imagen Ilustrativa -->
    <div class="login-image-section"></div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
