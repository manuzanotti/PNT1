<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Encuesta</title>
    </head>
    <body>
        <header>
            <h1>Encuesta de conocimiento o preferencias</h1>
        </header>

        <main>

            <form action="enviar-form">
                <section>

                    <div>
                        <h4>Lenguajes de programacion</h4>
                    </div>

                    <div>
                        <label for="radio-java">Java</label>
                        <input type="radio" name="lenguaje" id="radio-java" value="r-java">
                    </div>
                    
                    <div>
                        <label for="radio-javaScript">JavaScript</label>
                        <input type="radio" name="lenguaje" id="radio-javaScript" value="r-javaScript">
                    </div>
                    
                    <div>
                        <label for="radio-csharp">C#</label>
                        <input type="radio" name="lenguaje" id="radio-csharp" value="r-cSharp">
                    </div>

                </section>



                <section>

                    <div>
                        <h4>Tecnologias conocidas</h4>
                    </div>

                    <div>
                        <label for="chb-html">HTML</label>
                        <input type="checkbox" name="checkbox-html" id="chb-html" value="cbx-html">
                    </div>

                    <div>
                        <label for="chb-css">CSS</label>
                        <input type="checkbox" name="checkbox-css" id="chb-css" value="cbx-css">
                    </div>
            
                    <div>
                        <label for="chb-javaScript">JavaScript</label>
                        <input type="checkbox" name="checkbox-javaScript" id="chb-javaScript" value="cbx-js">
                    </div>

                    <div>
                        <label for="chb-sql">SQL</label>
                        <input type="checkbox" name="checkbox-sql" id="chb-sql" value="cbx-sql">
                    </div>

                    <div>
                        <label for="chb-java">Java</label>
                        <input type="checkbox" name="checkbox-java" id="chb-java" value="cbx-java">
                    </div>

                    <div>
                        <label for="chb-git">Git</label>
                        <input type="checkbox" name="checkbox-git" id="chb-git" value="cbx-git">
                    </div>

                </section>


                <section>
                
                    <div>
                        <h4>Carrera</h4>
                    </div>

                    <select name="carrera" id="carrera">
                        <option value="ingenieria">Ingenieria</option>
                        <option value="licenciatura">Licenciatura</option>
                        <option value="tecnicatura">Tecnicatura</option>
                        <option value="otro">Otro</option>
                    </select>

                </section>
                    
                    <div>
                        <button type="submit">Enviar</button>
                    </div>      
            </form>


        </main>

    </body>
</html>
