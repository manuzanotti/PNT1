<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
        <header>
            <h3>Primer Formulario con JS</h3>
        </header>

        <main>

            <form id="formUsuario">

                <div>
                    <div>
                        <label for="inpNombre">Nombre</label>
                        <input type="text" name="nombre" id="inpNombre">
                    </div>

                    <div>
                        <label for="inpMail">Email</label>
                        <input type="email" name="mail" id="inpMail">
                    </div>

                    <div>
                        <label for="inpEdad">Edad</label>
                        <input type="number" name="edad" id="inpEdad" min="0" max="120">
                    </div>

                    <div>
                        <button type="submit" id="inpEnviar">Enviar</button>
                    </div>

                        <p id="msg"></p>
                </div>

            </form>


       
        </main>



















</body>
</html>
