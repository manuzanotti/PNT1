<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header>
            <h3>Registra tu Libro!</h3>
        </header>

        <main>

            <form id="formLibro">

                <div>
                    <div>
                        <label for="inpTitulo">Titulo</label>
                        <input type="text" name="titulo" id="inpTitulo" required>
                    </div>

                    <div>
                        <label for="inpCategoria">Categoria</label>
                        <input type="text" name="categoria" id="inpCategoria" required>
                    </div>

                    <div>
                        <label for="inpAutor">Autor</label>
                        <input type="text" name="autor" id="inpAutor" required>
                    </div>

                    <div>
                        <button type="submit" id="inpEnviar">Enviar</button>
                    </div>

                </div>

            </form>


       
        </main>



















</body>
</html>
